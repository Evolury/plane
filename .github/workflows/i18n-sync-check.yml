name: i18n sync check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    # Evolury: a lista alcança o código dos componentes, e não só o pacote de
    # tradução. O check `literais-traduziveis` lê `apps/web`, `packages/ui`,
    # `packages/propel` e `packages/constants` — filtrado só por
    # `packages/i18n/**`, ele nunca rodaria justamente nos PRs que introduzem o
    # problema que ele existe para pegar.
    paths:
      - "packages/i18n/**"
      - "packages/constants/**"
      - "packages/ui/src/**"
      - "packages/propel/src/**"
      - "apps/web/core/**"
      - "apps/web/app/**"
      - ".github/workflows/i18n-sync-check.yml"
  push:
    branches:
      - "main"
    paths:
      - "packages/i18n/**"
      - "packages/constants/**"
      - "packages/ui/src/**"
      - "packages/propel/src/**"
      - "apps/web/core/**"
      - "apps/web/app/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-check:
    name: check:sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Run sync check
        run: pnpm dlx tsx packages/i18n/scripts/sync-check.ts --ci

      # Evolury: o sync-check compara os idiomas ENTRE SI e não pega a chave que
      # não existe em lugar nenhum — ela aparece na tela como o próprio
      # identificador, sem quebrar nada e sem alarme.
      - name: Chaves usadas no código existem no pt-BR
        run: pnpm dlx tsx packages/i18n/scripts/chaves-usadas.ts --ci

      # Evolury: o defeito mais comum não é chave faltando — é chave existente
      # e não consultada. A tradução está lá, correta, e o componente mostra o
      # texto em inglês. Nenhum dos dois checks acima enxerga isso.
      - name: Nenhum literal em inglês com tradução pronta
        run: pnpm dlx tsx packages/i18n/scripts/literais-traduziveis.ts --ci
