# Evolury: nome de projeto próprio, e não o do diretório.
#
# Este arquivo derrubou a produção em 11/08/2026. A pasta se chama `plane`, que
# é o nome do projeto da produção nesta máquina, e os serviços aqui têm os
# MESMOS nomes de lá (`plane-db`, `api`, `worker`...) — um `up` sem `-p` isolado
# recriou os containers de produção, e um `down -v` teria levado o banco.
#
# A linha abaixo tira a segurança das mãos de quem digita o comando.
name: planelocal

services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    # Evolury: a porta do host é configurável desde 22/08/2026.
    #
    # Esta máquina roda vários produtos em desenvolvimento ao mesmo tempo, e
    # todos publicavam as portas padrão. O primeiro a subir ficava com elas; os
    # outros falhavam no bind — e o caso do MinIO foi pior que falhar, porque
    # `localhost:9000` passou a responder pelo balde de outro projeto.
    #
    # O padrão continua sendo a porta de sempre: quem tem a máquina só para o
    # Plane não muda nada.
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  # Evolury: fora do `up` por padrão, desde 22/08/2026.
  #
  # O armazenamento de objetos do ambiente de desenvolvimento é COMPARTILHADO e
  # mora em `infra/minio` — um só para todos os produtos da máquina. Este aqui
  # ficou porque quem não tem a pilha do `infra` precisa de alguma coisa:
  #
  #     docker compose -f docker-compose-local.yml --profile minio-embarcado up -d
  #
  # E ele saiu do caminho porque estava fazendo mal calado. Publicava 9000 no
  # host, porta que nesta máquina já é de outro projeto; o bind falhava, o
  # serviço nem subia, e `AWS_S3_ENDPOINT_URL=http://localhost:9000` passava a
  # apontar para o MinIO do vizinho. Um upload de teste levou 403 por credencial
  # errada — com credencial compatível, teria escrito no balde alheio.
  plane-minio:
    profiles: ["minio-embarcado"]
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${DEV_MINIO_PORT:-9000}:9000"
      - "${DEV_MINIO_CONSOLE_PORT:-9090}:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    # Evolury: a porta do host é configurável desde 22/08/2026.
    #
    # Esta máquina roda vários produtos em desenvolvimento ao mesmo tempo, e
    # todos publicavam as portas padrão. O primeiro a subir ficava com elas; os
    # outros falhavam no bind — e o caso do MinIO foi pior que falhar, porque
    # `localhost:9000` passou a responder pelo balde de outro projeto.
    #
    # O padrão continua sendo a porta de sempre: quem tem a máquina só para o
    # Plane não muda nada.
    ports:
      - "${DEV_DB_PORT:-5432}:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "${DEV_API_PORT:-8000}:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge
